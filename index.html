<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <!-- Google Fonts for a clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Search & Cart Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Top Announcement Bar for Free Shipping Offer */
        .announcement-bar {
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #111;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #d4af37; /* classy gold accent or use #000 */
        }

        /* Search Bar & Icons */
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 12px;
            background: #f9f9f9;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            padding: 5px;
            font-size: 14px;
            width: 150px;
        }

        .search-box i {
            color: #777;
            font-size: 14px;
        }

        .cart-icon {
            font-size: 18px;
            color: #111;
            cursor: pointer;
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #111;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1500&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .btn-shop {
            background: #fff;
            color: #111;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.3s, color 0.3s;
        }

        .btn-shop:hover {
            background: #111;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar">
        ⚡ Free Shipping on all orders above ₹999! Shop Now. ⚡
    </div>

    <!-- Header Navigation -->
    <header>
        <a href="#" class="logo">Aura & Co.</a>
        
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="header-right">
            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" placeholder="Search products...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <!-- Cart Icon -->
            <div class="cart-icon">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Elevate Your Everyday Style</h1>
        <p>Discover the latest trends crafted for comfort and elegance.</p>
        <a href="#" class="btn-shop">Explore Collection</a>
    </section>

</body>
</html>
